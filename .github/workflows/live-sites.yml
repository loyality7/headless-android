name: live-sites

# The @LiveSite tests: real TLS, real redirects across hosts, real third-party
# script -- the things a local fixture cannot stand in for. Deliberately not a
# merge gate: a failure here is as likely to be a third-party outage as a
# regression, and the tests themselves skip (via assumeLiveSiteHealthy) rather
# than fail when the site's own status says so. Run weekly and on demand so a
# real regression here still surfaces without redenning every pull request.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

concurrency:
  group: live-sites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run live-site tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          disable-animations: true
          script: ./gradlew :headless:connectedDebugAndroidTest --stacktrace -Pandroid.testInstrumentationRunnerArguments.annotation=dev.headless.browser.LiveSite

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: live-sites-results
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          retention-days: 30
