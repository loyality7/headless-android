name: instrumented

# Device tests, on an emulator. Not on every push: they are slow, and an
# emulator cannot answer the vendor questions that matter here — MIUI refusing a
# background window, or a Xiaomi running out of memory mid-run. Treat a green
# emulator run as necessary, never sufficient: the probe's own results come from
# real hardware.
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly, so a regression surfaces within a day rather than at release.
    - cron: '0 3 * * *'

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # The floor and a current release. WebView behaviour varies far more by
        # WebView version than by OS version, so this is a smoke matrix, not a
        # compatibility claim.
        api-level: [26, 34]

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace -Pandroid.testInstrumentationRunnerArguments.notClass=dev.headless.browser.protocol.ProtocolCapabilityProbeDeviceTest,dev.headless.probe.DevToolsEndpointTest

      # The measurements are the point of the run, not the pass mark. Kept
      # whatever the outcome so numbers can be compared across runs.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: instrumented-api-${{ matrix.api-level }}
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          retention-days: 30
